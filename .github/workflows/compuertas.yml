name: compuertas y prompts

# Lo que verifica, en cada cambio a main y en cada pull request (trabajo `verificar`):
#   1. que las fuentes de gates/ validen contra su esquema y contra el Anexo H;
#   2. que las pruebas corran en verde, incluidos los rojos deliberados del validador,
#      el fixture que prende y apaga el interruptor y el test de idioma del nivel de
#      datos (D-051: ingles y ASCII puro, con la base congelada como unica excepcion);
#   3. que los prompts en inglés sean idénticos en los ocho idiomas (lo de siempre);
#   4. que lo publicado en docs/html/api/ sea exactamente lo que dan las fuentes;
#   5. que docs/COMPUERTAS.md siga coincidiendo con los datos de los que sale.
#
# Y lo que hace después, sólo en main y sólo si lo anterior quedó verde (trabajo
# `publicar`, D-052): copia docs/html/ al repositorio del portal, que es el que
# despliega a producción con su push a main. El dueño eligió el cruce completo
# sabiendo el costo: una credencial de escritura sobre el portal vive en los secretos
# de este repositorio, y todo lo que pase estas verificaciones sale publicado sin que
# nadie lo mire de nuevo. La compuerta humana que queda es la de antes: main está
# protegida y una fusión necesita el pull request y la aprobación de un propietario.
#
# La credencial es una CLAVE DE DESPLIEGUE (deploy key) del repositorio del portal, no
# un token de la cuenta: alcanza exactamente a ese repositorio y a ningún otro, y se
# revoca desde sus ajustes sin tocar nada más. Si falta el secreto, el trabajo falla
# diciendo qué falta, en vez de saltarse la publicación en silencio.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Dos publicaciones no se pisan, y una que ya arrancó no se cancela a mitad de camino.
concurrency:
  group: compuertas-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # El repositorio no tiene dependencias: todo corre con node pelado.

      # Mismo criterio que las pruebas, y por el mismo motivo medido: un paso que no
      # imprime nada no demostro nada. En la corrida 39956832685 este paso y el de
      # COMPUERTAS.md corrieron EN VACIO sobre ubuntu-latest -- el guardian de linea de
      # comandos de los dos programas solo acertaba en Windows -- y cerraron en verde.
      # Ahora, ademas de exigir codigo de salida cero, se exige la linea que el programa
      # imprime cuando de verdad corrio.
      - name: Validar las compuertas contra su esquema y contra el Anexo H
        run: |
          set -o pipefail
          node build/gates_validate.mjs | tee validacion.txt
          grep -q 'compuertas: validado' validacion.txt || { echo "::error::el validador no dijo nada: no corrio, y un paso que no corrio no es un verde"; exit 1; }
          rm validacion.txt

      # Sin el patron entre comillas: medido que en otro interprete node no lo expande,
      # corre CERO pruebas y devuelve exito. Un verde con cero pruebas no es un verde,
      # asi que ademas de exigir 0 fallos se exige que haya corrido al menos una.
      - name: Pruebas
        run: |
          set -o pipefail
          node --test | tee pruebas.tap
          grep -qE '^# fail 0$' pruebas.tap
          grep -qE '^# pass [1-9][0-9]*$' pruebas.tap || { echo "cero pruebas corridas: eso no es un verde"; exit 1; }
          rm pruebas.tap

      - name: Verificar los prompts en los ocho idiomas
        run: node build/prompts.mjs

      - name: Regenerar lo publicado y exigir que coincida con lo commiteado
        run: node build/api_check.mjs

      - name: Exigir que docs/COMPUERTAS.md coincida con los datos
        run: |
          set -o pipefail
          node build/gates_doc.mjs --check | tee documento.txt
          grep -q 'coincide con los datos' documento.txt || { echo "::error::la comprobacion del documento no dijo nada: no corrio, y un paso que no corrio no es un verde"; exit 1; }
          rm documento.txt

      - name: Dejar el arbol limpio (ningun generado sin commitear)
        run: |
          git diff --stat -- docs/html/api/ gates/ docs/COMPUERTAS.md
          if [ -n "$(git status --porcelain -- gates/ docs/COMPUERTAS.md)" ]; then
            echo "Hay fuentes o documentos generados sin commitear."
            exit 1
          fi

  publicar:
    name: publicar en el portal
    needs: verificar
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    env:
      PORTAL: pkuschnirof/rpaforce
      # Las dos copias que vive el portal, y por qué son dos:
      #   - api/  es el extremo canónico, el que una herramienta le pide por red
      #     (https://yujin.app/urazuke/api/gates.json, igual que prompts.json);
      #   - docs/ es el sitio legible, y arrastra su propia copia de api/.
      DESTINO_DOCS: yujin.app/urazuke/docs
      DESTINO_API: yujin.app/urazuke/api

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Exigir la credencial del portal
        env:
          CLAVE: ${{ secrets.PORTAL_DEPLOY_KEY }}
        run: |
          if [ -z "$CLAVE" ]; then
            echo "::error::Falta el secreto PORTAL_DEPLOY_KEY (la clave de despliegue del repositorio del portal). Agregalo en Settings > Secrets and variables > Actions y volve a correr. Sin eso no se publica, y no se saltea en silencio."
            exit 1
          fi
          echo "La credencial del portal esta presente."

      # No se regenera nada acá a propósito: regenerar reescribiría generated_at y
      # terminaríamos publicando algo distinto de lo que quedó commiteado en main. Lo
      # que sí se hace es lo que hace un consumidor: recalcular la huella del archivo
      # que se va a copiar y exigir que coincida con la que declara.
      - name: Recalcular la huella de lo que se va a publicar
        run: node build/api_check.mjs --huella

      - name: Sanidad de lo generado (que haya sitio para publicar)
        run: |
          for f in docs/html/ESCALERA_METODOLOGICA.html docs/html/COMPUERTAS.html docs/html/api/gates.json docs/html/api/prompts.json docs/html/api/index.json; do
            [ -s "$f" ] || { echo "::error::falta o esta vacio $f -- no se publica un sitio a medias"; exit 1; }
          done
          echo "archivos a publicar: $(find docs/html -type f | wc -l)"

      - name: Clonar el repositorio del portal
        env:
          CLAVE: ${{ secrets.PORTAL_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$CLAVE" > ~/.ssh/portal
          chmod 600 ~/.ssh/portal
          ssh-keyscan -t rsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          # Clon completo y no superficial: desde un clon superficial GitHub rechaza el push.
          # La ruta se deja resuelta acá y no escrita a mano: el push de más abajo corre en
          # otro paso, con otro intérprete, y ahí ~ no se expande dentro de la variable.
          SSH_CMD="ssh -i ${HOME}/.ssh/portal -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          GIT_SSH_COMMAND="$SSH_CMD" git clone "git@github.com:${PORTAL}.git" portal
          echo "GIT_SSH_COMMAND=${SSH_CMD}" >> "$GITHUB_ENV"

      # Espejo completo: se vacían los dos directorios y se vuelven a llenar, así lo que
      # el método dejó de generar desaparece del sitio en vez de quedar ahí para siempre.
      # El vaciado alcanza SÓLO a esos dos directorios, que son los que el método es
      # dueño de llenar; fuera de ahí no se toca un solo archivo del portal, y hay una
      # guarda que lo exige antes de borrar nada. Si la copia fallara a mitad de camino
      # no se publica nada: los pasos siguientes corren con set -e y no se commitea.
      #
      # Es `cp -a` y no `rsync` a propósito: así esto mismo se puede ensayar en una
      # máquina cualquiera, sin depender de una herramienta que esté sólo en el runner.
      - name: Copiar docs/html/ a las dos copias del portal
        run: |
          set -e
          for d in "${DESTINO_DOCS}" "${DESTINO_API}"; do
            case "$d" in
              yujin.app/urazuke/*) : ;;
              *) echo "::error::destino fuera del arbol del metodo en el portal: '$d'"; exit 1 ;;
            esac
            [ -d "portal/$d" ] || { echo "::error::el portal no tiene portal/$d -- cambio de estructura, no se publica a ciegas"; exit 1; }
          done
          rm -rf "portal/${DESTINO_DOCS}" "portal/${DESTINO_API}"
          mkdir -p "portal/${DESTINO_DOCS}" "portal/${DESTINO_API}"
          cp -a docs/html/. "portal/${DESTINO_DOCS}/"
          cp -a docs/html/api/. "portal/${DESTINO_API}/"
          # La trampa que este vaciado es: cualquier configuracion de servidor puesta
          # ADENTRO de estos dos directorios se evapora en la publicacion siguiente, y el
          # que la puso se entera semanas despues preguntandose por que se "desconfiguro
          # sola". De ahi las dos guardas:
          #   1. si aparece un .htaccess adentro de lo que se vacia, se para. No se
          #      publica una configuracion que se va a borrar sola.
          #   2. la que de verdad tiene que existir vive un nivel ARRIBA
          #      (yujin.app/urazuke/.htaccess) y se hereda hacia abajo: si falta, se avisa,
          #      porque sin ella la interfaz de datos no es legible desde un navegador.
          #      Es del portal y no del metodo, asi que avisa y no frena.
          if find "portal/${DESTINO_DOCS}" "portal/${DESTINO_API}" -name '.htaccess' | grep -q .; then
            echo "::error::hay un .htaccess adentro de un directorio que esta publicacion vacia: se borraria en la proxima. La configuracion va en portal/yujin.app/urazuke/.htaccess, un nivel arriba"
            exit 1
          fi
          if [ -f "portal/yujin.app/urazuke/.htaccess" ]; then
            echo "el archivo esta commiteado en el portal y fuera del alcance del vaciado: portal/yujin.app/urazuke/.htaccess"
            echo "OJO: esto dice que el ARCHIVO esta, no que el servidor lo tenga puesto. Medido el 2026-10-24: estuvo commiteado y desplegado en verde sin llegar nunca al servidor, porque el rsync del portal lo excluia. Quien contesta de verdad es el paso 'Preguntar a produccion...', mas abajo"
          else
            echo "::warning::falta portal/yujin.app/urazuke/.htaccess (CORS y Cache-Control de la interfaz de datos, y el indice como DirectoryIndex). Es del repositorio del portal: ponela ahi, no adentro de api/"
          fi
          # Se prepara el cambio y se mira LO PREPARADO, no el estado del directorio.
          # Medido en el ensayo: una copia deja los archivos con fecha nueva y `git
          # status` los llama modificados aunque el contenido sea idéntico. Si la
          # pregunta "¿hay algo que publicar?" se le hace al directorio, una
          # publicación que no cambia nada se ve como si cambiara 129 archivos, y el
          # commit que viene después se cae en rojo sin tener nada que commitear.
          git -C portal add -A -- "${DESTINO_DOCS}" "${DESTINO_API}"
          echo "--- lo que cambia en el portal ---"
          git -C portal diff --cached --stat -- "${DESTINO_DOCS}" "${DESTINO_API}" | tail -40
          echo "--- archivos que desaparecen del portal ---"
          git -C portal diff --cached --name-status --diff-filter=D -- "${DESTINO_DOCS}" "${DESTINO_API}" | sed 's/^/  /'

      - name: Commitear y empujar al portal (su push despliega a produccion)
        run: |
          set -e
          CATALOGO=$(node -e "process.stdout.write(require('./docs/html/api/gates.json').catalog_version)")
          HUELLA=$(node -e "process.stdout.write(require('./docs/html/api/gates.json').content_hash.value.slice(0,12))")
          # Los dos archivos tienen identidad propia (D-053): el mensaje nombra las dos, para
          # que el commit del portal diga que version del metodo quedo servida.
          CORPUS=$(node -e "process.stdout.write(require('./docs/html/api/prompts.json').corpus_version)")
          HUELLAP=$(node -e "process.stdout.write(require('./docs/html/api/prompts.json').content_hash.value.slice(0,12))")
          cd portal
          if git diff --cached --quiet -- "${DESTINO_DOCS}" "${DESTINO_API}"; then
            echo "El portal ya tiene exactamente esto: no hay nada que publicar."
            exit 0
          fi
          git config user.name 'publicacion de urazuke'
          git config user.email 'actions@github.com'
          git commit -m "urazuke: publica docs y api del metodo (${GITHUB_SHA:0:7}, compuertas ${CATALOGO}/${HUELLA}, prompts ${CORPUS}/${HUELLAP})"
          git push origin HEAD:main
          echo "Empujado al portal. Su propio despliegue lo lleva a produccion."

      # Evidencia de que la publicación llegó, no de que se intentó, y -- desde el
      # 2026-10-23 -- evidencia que dice QUÉ vio. La corrida 39952871636 publicó bien
      # (el portal commiteó 161e74d y su despliegue cerró verde 35 segundos después) y
      # este paso dio 40 intentos con «(sin respuesta)» durante 13m17s y cerró avisando
      # que producción todavía no las servía. Era falso. El defecto no era la red: era
      # que tres situaciones muy distintas se colapsaban en una sola cadena y la única
      # señal que las separaba -- el código HTTP, el error de red -- se tiraba a
      # /dev/null. Ahora las separa `build/portal_verify.mjs`, que corre con node pelado
      # y sin curl, se puede correr igual desde una máquina cualquiera, y distingue:
      #   coincide     -> verde;
      #   otra_huella  -> aviso, y dice qué huella sirve producción (eso SÍ es el
      #                   despliegue del portal, que es otro flujo y puede estar corriendo);
      #   ilegible     -> ROJO, con el código HTTP o el error de red a la vista.
      # El rojo dice lo que pasó: la publicación ocurrió y la evidencia falta. No dice
      # que el método publicó mal, y por eso no se lee como un rojo de publicación.
      # Conviene saber, para leer ese rojo: el host del portal (cPanel de GoDaddy) ya
      # tiene documentado en su propio flujo de despliegue que rechaza conexiones del
      # runner de GitHub, así que una lectura imposible desde CI puede ser del host y no
      # del método. Lo que se comprueba a mano en dos segundos es
      # `node build/portal_verify.mjs --rondas 1`.
      - name: Verificar que produccion sirve estas huellas
        run: |
          set +e
          node build/portal_verify.mjs
          CODIGO=$?
          set -e
          case "$CODIGO" in
            0) echo "Publicado y verificado: produccion sirve las dos huellas." ;;
            2) echo "::warning::Produccion contesta y todavia sirve otra huella (el detalle, arriba). El despliegue del portal es otro flujo y puede estar corriendo; revisalo si en unos minutos sigue asi." ;;
            *) echo "::error::Se publico y NO se pudo verificar: no se pudo leer produccion (el motivo exacto, arriba). La publicacion ocurrio; lo que falta es la evidencia de que llego. Comprobalo a mano con: node build/portal_verify.mjs --rondas 1"; exit 1 ;;
          esac

      # La guarda del .htaccess de arriba mira el REPOSITORIO del portal; esto mira el
      # SERVIDOR, que es donde la configuracion surte efecto o no. Se separaron porque
      # el 2026-10-24 el archivo estuvo commiteado, el despliegue del portal corrio en
      # verde y produccion seguia contestando 403 en el directorio y sin CORS ni
      # Cache-Control en los tres recursos: el transporte del portal excluia el archivo.
      # Avisa y no frena, por lo mismo que la guarda: esa configuracion es del portal y
      # no del metodo. Lo que no hace es dejar la publicacion diciendo que todo esta
      # bien cuando la interfaz de datos no se puede consumir.
      - name: Preguntar a produccion si la interfaz de datos se puede consumir
        run: |
          set +e
          node build/api_headers.mjs
          CODIGO=$?
          set -e
          if [ "$CODIGO" = "0" ]; then
            echo "La interfaz de datos se puede consumir: directorio, CORS y Cache-Control."
          else
            echo "::warning::La interfaz de datos esta publicada pero NO se puede consumir del todo (el detalle, arriba). Es configuracion del repositorio del portal (yujin.app/urazuke/.htaccess) y de su transporte, no del metodo. Repetilo a mano con: node build/api_headers.mjs"
          fi
